<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090a" />
    <script>
      // Apply the saved or system theme before first paint, so there's no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("vip.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>VIP Motors · Pre-owned luxury cars in Bengaluru</title>
    <meta name="description" content="Certified pre-owned luxury cars from VIP Motors, Rajajinagar, Bengaluru. Browse the stock, ask the AI concierge for a match, or sell your car to us." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,100..125,300..900;1,100..125,300..900&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
